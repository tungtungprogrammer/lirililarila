name: Build Project with RomkoSI G3D

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4

      - name: Pobierz bibliotekę G3D (RomkoSI)
        run: |
          git clone https://github.com/RomkoSI/G3D.git ../G3D

      - name: Skonfiguruj MSYS2 i MinGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake

      - name: Skompiluj projekt za pomocą CMake
        shell: msys2 {0}
        run: |
          mkdir -p build
          cd build
          cmake -G "Unix Makefiles" \
            -DCMAKE_INCLUDE_PATH="../G3D/G3D10/G3D.lib/include" \
            -DCMAKE_CXX_FLAGS="-I../G3D/G3D10/G3D.lib/include" ..
          make -j$(nproc)

      - name: Zapisz zbudowane pliki (Artefakty)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g3d-build-mingw
          path: build/
