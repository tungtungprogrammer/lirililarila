name: Build G3D with MinGW64

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Pobierz kod repozytorium
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Skonfiguruj MSYS2 i MinGW64
        uses: msys2/setup-msys2@v2
        with:
          msystem: MINGW64
          update: true
          install: >-
            git
            make
            mingw-w64-x86_64-gcc
            mingw-w64-x86_64-cmake
            mingw-w64-x86_64-python

      - name: Skompiluj projekt w MSYS2 (MinGW64)
        shell: msys2 {0}
        run: |
          make
          # Jeśli zamiast samych poleceń make używasz skryptu python, odkomentuj poniższą linię:
          # python buildg3d --install release lib

      - name: Zapisz zbudowane pliki (Artefakty)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: g3d-build-mingw
          path: |
            build/
            *.a
            *.exe
