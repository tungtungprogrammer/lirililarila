name: build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  windows-msvc:
    runs-on: windows-2022
    steps:
      - name: Checkout Studio
        uses: actions/checkout@v4

      - name: Checkout G3D
        uses: actions/checkout@v4
        with:
          repository: RomkoSI/G3D
          path: G3D

      - uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Set up MSVC environment
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      # G3D's pre-build events call bin\CopyIfNewer.exe, an old prebuilt binary that crashes on
      # current Windows with 0xC0000135 (missing DLL). Replace every call with a small Python shim
      # that uses G3D's own bin/ice/copyifnewer.py.
      - name: Replace broken CopyIfNewer.exe with a Python shim
        shell: pwsh
        run: |
          $shim = @'
          import os, sys
          sys.path.insert(0, os.path.dirname(os.path.abspath(__file__)))
          from ice.copyifnewer import copyIfNewer
          args = [a for a in sys.argv[1:] if not a.startswith('--')]
          if len(args) >= 2:
              copyIfNewer(args[0], args[1])
          sys.exit(0)
          '@
          Set-Content -Path G3D/bin/copyifnewer_shim.py -Value $shim -Encoding utf8
          $pattern = '"\$\(ProjectDir\)\.\.\\bin\\copyifnewer"'
          $repl    = 'python "$(ProjectDir)..\bin\copyifnewer_shim.py"'
          $n = 0
          Get-ChildItem G3D/VisualStudio/*.vcxproj | ForEach-Object {
            $t = [IO.File]::ReadAllText($_.FullName)
            $u = [regex]::Replace($t, $pattern, $repl)
            if ($u -ne $t) { [IO.File]::WriteAllText($_.FullName, $u); $n++ }
          }
          Write-Host "Patched $n project files"

      # Current MSVC STL removed things this old code uses. Patch the sources directly:
      #  - std::_Hash_seq (only used by a dead stdext::hash_value helper in G3DString.h)
      #  - std::binary_function (OpenEXR in FreeImage)
      #  - std::auto_ptr (Win32Window)
      - name: Patch old C++ in G3D sources
        shell: pwsh
        run: |
          function Patch($path, $pattern, $repl) {
            $t = [IO.File]::ReadAllText($path)
            $u = [regex]::Replace($t, $pattern, $repl)
            if ($u -eq $t) { throw "Patch did not apply to $path" }
            [IO.File]::WriteAllText($path, $u)
            Write-Host "Patched $path"
          }
          Patch 'G3D/G3D.lib/include/G3D/G3DString.h' '#if defined\(G3D_64BIT\) && _MSC_VER(\r?\n// For use with hash_map)' '#if 0$1'
          Patch 'G3D/freeimage.lib/source/OpenEXR/IlmImf/ImfAttribute.cpp' 'struct NameCompare\s*:\s*std::binary_function\s*<[^>]*>' 'struct NameCompare'
          Patch 'G3D/GLG3D.lib/include/GLG3D/Win32Window.h' 'std::auto_ptr<Win32Window>' 'std::unique_ptr<Win32Window>'
          Patch 'G3D/GLG3D.lib/source/Win32Window.cpp' 'std::auto_ptr<Win32Window> s\(NULL\)' 'std::unique_ptr<Win32Window> s(nullptr)'
          Patch 'G3D/GLG3D.lib/source/Win32Window.cpp' 'std::auto_ptr<Win32Window>' 'std::unique_ptr<Win32Window>'

      # Stages headers + prebuilt MSVC libs (FFmpeg, PhysX, TBB, ...) into G3D/build.
      # Its own Debug/freeimage MSBuild call targets the v140 toolset and is expected to fail.
      - name: Stage G3D headers and prebuilt libs
        working-directory: G3D
        continue-on-error: true
        run: python buildg3d --install release lib

      # G3D is old C++: it uses std::auto_ptr / std::binary_function, which newer MSVC STLs hide.
      # The CL environment variable is read by cl.exe, so this applies to every library project.
      - name: Build G3D libraries (Release x64)
        shell: pwsh
        env:
          CL: /D_HAS_AUTO_PTR_ETC=1 /D_HAS_UNARY_BINARY_FUNCTION=1 /D_SILENCE_ALL_CXX17_DEPRECATION_WARNINGS /D_CRT_SECURE_NO_WARNINGS
        run: |
          $projects = 'zlib.lib','zip.lib','glfw.lib','glew.lib','freeimage.lib','enet.lib',
                      'assimp.lib','civetweb.lib','nfd.lib','qrencode.lib','G3D.lib','GLG3D.lib'
          $failed = @()
          foreach ($p in $projects) {
            Write-Host "=== $p ==="
            msbuild "G3D/VisualStudio/$p.vcxproj" /m /nologo /v:m /clp:ErrorsOnly `
              /p:Configuration=Release /p:Platform=x64 `
              /p:PlatformToolset=v143 /p:WindowsTargetPlatformVersion=10.0
            if ($LASTEXITCODE -ne 0) { $failed += $p }
          }
          if ($failed.Count -gt 0) { throw "MSBuild failed on: $($failed -join ', ')" }

      - name: List G3D build output
        shell: pwsh
        run: |
          Get-ChildItem G3D/build/lib -Filter *.lib | Select-Object -ExpandProperty Name
          Test-Path G3D/build/include/G3D/G3DAll.h

      - name: Configure Studio
        shell: pwsh
        run: |
          $ws = $env:GITHUB_WORKSPACE -replace '\\','/'
          $libs = Get-ChildItem G3D/build/lib -Filter *.lib |
                  Where-Object { $_.Name -notmatch 'DEBUG|CHECKED|fmodL' -and $_.Name -notmatch 'd\.lib$' } |
                  ForEach-Object { $_.FullName -replace '\\','/' }
          $libs += @('opengl32','glu32','gdi32','winmm','ws2_32','user32','shell32','ole32','advapi32','comdlg32','iphlpapi')
          cmake -S . -B build -G "Visual Studio 17 2022" -A x64 `
            "-DG3D_INCLUDE_DIRS=$ws/G3D/build/include" `
            "-DG3D_LIBRARIES=$($libs -join ';')"

      - name: Build Studio
        run: cmake --build build --config Release

      - name: Collect runtime files
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          Copy-Item build/Release/Studio.exe dist/
          Copy-Item G3D/build/bin/*.dll dist/ -ErrorAction SilentlyContinue
          Copy-Item G3D/data-files dist/data-files -Recurse

      - uses: actions/upload-artifact@v4
        with:
          name: OldBloxStudio-windows
          path: dist
